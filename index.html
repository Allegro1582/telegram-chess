<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allegro Chess</title>
  
  <meta property="og:title" content="Allegro Chess">
  <meta property="og:description" content="Free Chess on Telegram">
  <meta property="og:image" content="https://allegro1582.github.io/telegram-chess/AllegroChess2.jpg">
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1e1e24;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    
    .lang-selector {
      display: flex;
      gap: 4px;
      margin-bottom: 14px;
      background: #141418;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid #2d2d38;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: #8e8e99;
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
      letter-spacing: 0.5px;
    }
    .lang-btn:hover {
      color: #ffffff;
    }
    .lang-btn.active {
      background: #2ea6ff;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(46, 166, 255, 0.4);
    }

    #status {
      font-size: 1.1rem;
      margin-bottom: 12px;
      font-weight: 600;
      text-align: center;
      min-height: 2.4em;
    }
    
    .board-container {
      position: relative;
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
    }

    #board {
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      border-radius: 8px;
      overflow: visible !important;
      position: relative;
    }

    .board-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 15, 20, 0.85);
      backdrop-filter: blur(3px);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 500;
      animation: fadeIn 0.4s ease forwards;
    }
    .board-overlay h2 {
      margin: 0;
      font-size: 2.2rem;
      color: #ff4d4d;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 4px 12px rgba(255, 77, 77, 0.4);
    }
    .board-overlay p {
      margin: 8px 0 0 0;
      font-size: 1rem;
      color: #d0d0d5;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .notation-32298 { color: #a0a0ab !important; font-weight: bold; font-size: 11px; }
    .alpha-d2270 { bottom: -18px !important; right: 4px !important; }
    .numeric-fc462 { left: -16px !important; top: 4px !important; }

    .highlight-selected { background-color: rgba(255, 235, 59, 0.5) !important; }
    .highlight-hint { box-shadow: inset 0 0 0 3px #4caf50 !important; cursor: pointer !important; }
    .highlight-capture {
      box-shadow: inset 0 0 0 3px #f44336 !important;
      cursor: pointer !important;
      position: relative;
    }
    .highlight-capture::after {
      content: "⚔️";
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      pointer-events: none;
      z-index: 100;
      opacity: 0.9;
      text-shadow: 0px 0px 8px rgba(0,0,0,0.9);
    }

    .controls {
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 360px;
    }
    .action-buttons { display: flex; gap: 10px; width: 100%; }
    button {
      flex: 1;
      padding: 12px 8px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-send { background-color: #2ea6ff; color: #ffffff; }
    .btn-undo { background-color: #ff9800; color: #ffffff; }
    .btn-draw { background-color: #9c27b0; color: #ffffff; }
    .btn-accept { background-color: #4caf50; color: #ffffff; }
    .btn-decline { background-color: #f44336; color: #ffffff; }
    .btn-reset { background-color: #e53935; color: #ffffff; }
    
    .rules-container {
      width: 100%;
      max-width: 360px;
      margin-top: 15px;
      border: 1px solid #33333e;
      border-radius: 10px;
      overflow: hidden;
      background-color: #262630;
    }
    details { width: 100%; }
    summary {
      padding: 12px 15px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      color: #2ea6ff;
      outline: none;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "►"; font-size: 0.8rem; transition: transform 0.2s; }
    details[open] summary::after { transform: rotate(90deg); }
    .rules-content {
      padding: 0 15px 15px 15px;
      font-size: 0.85rem;
      line-height: 1.4;
      color: #d0d0d5;
      border-top: 1px solid #33333e;
    }
    .rules-content h4 { margin: 12px 0 4px 0; color: #ffffff; }
    .rules-content ol, .rules-content ul { margin: 4px 0; padding-left: 18px; }
  </style>
</head>
<body>

  <div class="lang-selector">
    <button class="lang-btn" data-lang="ru" onclick="setLanguage('ru')">RU</button>
    <button class="lang-btn" data-lang="ua" onclick="setLanguage('ua')">UA</button>
    <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>

  <div class="controls">

      <button class="btn-send" id="sendBtn" onclick="shareMove()">📤 Send Move</button>
      <button class="btn-undo" id="undoBtn" onclick="undoMove()">↩️ Undo</button>
    </div>

    <div class="action-buttons" id="drawOfferActions" style="display:none;">

      <button class="btn-decline" id="declineBtn" onclick="declineDraw()">❌ Decline</button>
    </div>

    <div class="action-buttons" id="mainOptions">
      <button class="btn-draw" id="drawBtn" onclick="offerDraw()">🤝 Draw?</button>
      <button class="btn-reset" id="resetBtn" onclick="resetGame()">🔄 Reset</button>
    </div>
  </div>

    <details>
      <summary id="rulesHeader">📖 Rules & Guide</summary>
      <div class="rules-content" id="rulesContent">
      </div>

            <li><b>Хід:</b> Зробіть хід та натисніть <b>«📤 Надіслати хід»</b>. Виберіть чат із суперником.</li>
            <li><b>Продовження:</b> Завжди натискайте на <b>ОСТАННЄ надіслане посилання</b>.</li>
          </ol>

      },
      en: {
        send: "📤 Send Move",
        undo: "↩️ Undo Move",
        accept: "✅ Accept Draw",
        decline: "❌ Decline",
        draw: "🤝 Offer Draw",
        reset: "🔄 Reset",
        rulesTitle: "📖 Rules & Instructions",
        white: "White",
        black: "Black",
        turn: "Turn",
        moved: "Move done! Press \"Send Move\".",
        check: "(Check!)",
        checkmate: "Checkmate! Winner: ",
        defeatTitle: "💀 Defeat!",
        checkmateSub: "Checkmate",
        drawGame: "🤝 Game ended in a draw!",
        drawOffer: "🤝 Opponent offers a draw!",
        drawAccepted: "🤝 Draw accepted!",
        myMoveText: "♟️ My move",
        yourTurnText: "Your turn:",
        checkText: "! (Check ⚡) Your turn:",
        checkmateText: " (CHECKMATE 🏆) Game over!",
        drawOfferText: "🤝 Offering a draw! Accept?",
        rulesHtml: `
          <h4>♟️ 1. Controls & Moves</h4>
          <ul>
            <li><b>Click & Select:</b> Tap a piece. Empty squares highlight in <b>green</b>, enemy squares in <b>red with swords ⚔️</b>.</li>

      },

        reset: "🔄 Reiniciar",

        checkmateSub: "Jaque mate",
        drawGame: "🤝 ¡Partida en tablas!",
        drawOffer: "🤝 ¡El oponente ofrece tablas!",
        drawAccepted: "🤝 ¡Tablas aceptadas!",
        myMoveText: "♟️ Mi jugada",
        yourTurnText: "Tu turno:",
        checkText: "! (¡Jaque ⚡!) Tu turno:",
        checkmateText: " (¡MATE 🏆!) ¡Fin de la partida!",
        drawOfferText: "🤝 ¡Propongo tablas! ¿Aceptas?",
        rulesHtml: `
          <h4>♟️ 1. Controles y movimientos</h4>
          <ul>
            <li><b>Clic y selección:</b> Toca una pieza. Las casillas vacías se resaltan en <b>verde</b>, las enemigas en <b>rojo con espadas ⚔️</b>.</li>
            <li><b>Arrastrar:</b> Mantén y arrastra la pieza.</li>
            <li><b>Deshacer:</b> Antes de enviar, pulsa <b>«↩️ Deshacer»</b>.</li>
          </ul>

          <ol>
            <li><b>Mover:</b> Haz tu jugada y pulsa <b>«📤 Enviar jugada»</b>. Elige el chat del rival.</li>
            <li><b>Continuar:</b> Pulsa siempre el <b>ÚLTIMO enlace recibido</b> en el chat.</li>
          </ol>
        `
      },
      it: {
        send: "📤 Invia Mossa",
        undo: "↩️ Annulla",
        accept: "✅ Accetta Patta",
        decline: "❌ Rifiuta",
        draw: "🤝 Patta?",
        reset: "🔄 Ricomincia",
        rulesTitle: "📖 Regole e Istruzioni",
        white: "Bianchi",
        black: "Neri",
        turn: "Turno",
        moved: "Mossa fatta! Premi \"Invia Mossa\".",
        check: "(Scacco!)",
        checkmate: "Scacco matto! Vincono i ",

        drawAccepted: "🤝 Patta accettata!",
        myMoveText: "♟️ La mia mossa",
        yourTurnText: "Il tuo turno:",
        checkText: "! (Scacco ⚡) Il tuo turno:",
        checkmateText: " (SCACCO MATTO 🏆) Partita finita!",
        drawOfferText: "🤝 Propongo la patta! Accetti?",
        rulesHtml: `
          <h4>♟️ 1. Controlli e Mosse</h4>
          <ul>
            <li><b>Clicca e Seleziona:</b> Tocca un pezzo. Le caselle vuote si evidenziano in <b>verde</b>, quelle nemiche in <b>rosso con spade ⚔️</b>.</li>
            <li><b>Trascina:</b> Trascina i pezzi sulla casella desiderata.</li>
            <li><b>Annulla:</b> Prima di inviare, premi <b>«↩️ Annulla»</b>.</li>
          </ul>
          <h4>🔄 2. Svolgimento</h4>
          <ol>
            <li><b>Fai la mossa:</b> Muovi e premi <b>«📤 Invia Mossa»</b>. Seleziona la chat dell'avversario.</li>
            <li><b>Continua:</b> Clicca sempre sull'<b>ULTIMO link inviato</b> nella chat.</li>
          </ol>
        `
      }
    };

    let currentLang = localStorage.getItem('app_lang') || (tg?.initDataUnsafe?.user?.language_code?.substring(0,2)) || 'ru';
    if (!translations[currentLang]) currentLang = 'ru';

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('app_lang', lang);
      
      $('.lang-btn').removeClass('active');
      $(`.lang-btn[data-lang="${lang}"]`).addClass('active');

      const t = translations[currentLang];
      $('#sendBtn').text(t.send);
      $('#undoBtn').text(t.undo);
      $('#acceptBtn').text(t.accept);
      $('#declineBtn').text(t.decline);
      $('#drawBtn').text(t.draw);
      $('#resetBtn').text(t.reset);
      $('#rulesHeader').text(t.rulesTitle);
      $('#rulesContent').html(t.rulesHtml);
      $('#overlayTitle').text(t.defeatTitle);
      $('#overlaySub').text(t.checkmateSub);

      updateStatus();
    }

    let board = null;
    let game = new Chess();
    let initialFen = null;
    let selectedSquare = null;

    const urlParams = new URLSearchParams(window.location.search);
    const rawFen = urlParams.get('fen');
    const isDrawOffer = urlParams.get('drawOffer') === 'true';

    if (rawFen) {
      game.load(decodeURIComponent(rawFen));
    }
    initialFen = game.fen();

    function removeHighlights () {
      $('#board .square-55d63').removeClass('highlight-selected highlight-hint highlight-capture');
    }

    function showLegalMoves (square) {
      removeHighlights();
      const moves = game.moves({ square: square, verbose: true });
      if (moves.length === 0) return;

      $('#board .square-' + square).addClass('highlight-selected');
      for (let i = 0; i < moves.length; i++) {
        const move = moves[i];
        if (move.flags.includes('c') || move.flags.includes('e')) {
          $('#board .square-' + move.to).addClass('highlight-capture');
        } else {
          $('#board .square-' + move.to).addClass('highlight-hint');
        }
      }
    }

    function makeMove (source, target) {
      if (game.fen() !== initialFen) {
        game.undo();
      }

      const move = game.move({
        from: source,
        to: target,
        promotion: 'q'
      });

      if (move === null) return false;

      removeHighlights();
      board.position(game.fen());
      updateStatus();
      document.getElementById('moveActions').style.display = 'flex';
      selectedSquare = null;
      return true;
    }

    function handleSquareClick (square) {
      if (game.game_over() || isDrawOffer) return;

      const piece = game.get(square);
      const isCurrentTurnPiece = piece && (
        (game.turn() === 'w' && piece.color === 'w') ||
        (game.turn() === 'b' && piece.color === 'b')
      );

      if (isCurrentTurnPiece) {
        selectedSquare = square;
        showLegalMoves(square);
        return;
      }

      if (selectedSquare) {
        const moved = makeMove(selectedSquare, square);
        if (!moved) {
          removeHighlights();
          selectedSquare = null;
        }
      }
    }

    function onDragStart (source, piece) {
      if (game.game_over() || isDrawOffer) return false;
      if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
          (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
        return false;
      }
      selectedSquare = source;
      showLegalMoves(source);
    }

    function onDrop (source, target) {
      const moved = makeMove(source, target);
      if (!moved) return 'snapback';
    }

    function onSnapEnd () {
      removeHighlights();
    }

    function undoMove() {
      game.load(initialFen);
      board.position(initialFen);
      removeHighlights();
      selectedSquare = null;
      document.getElementById('moveActions').style.display = 'none';
      document.getElementById('boardOverlay').style.display = 'none';
      updateStatus();
    }

    function updateStatus () {
      const t = translations[currentLang];
      let status = '';
      let moveColor = game.turn() === 'b' ? t.black : t.white;

      if (isDrawOffer) {
        status = t.drawOffer;
        document.getElementById('drawOfferActions').style.display = 'flex';
        document.getElementById('mainOptions').style.display = 'none';
        document.getElementById('boardOverlay').style.display = 'none';
      } else if (game.in_checkmate()) {
        status = `${t.checkmate}${game.turn() === 'w' ? t.black : t.white}.`;
        document.getElementById('boardOverlay').style.display = 'flex';
      } else if (game.in_draw()) {
        status = t.drawGame;
        document.getElementById('boardOverlay').style.display = 'none';
      } else {
        document.getElementById('boardOverlay').style.display = 'none';
        const isMoved = game.fen() !== initialFen;
        status = isMoved ? t.moved : `${t.turn}: ${moveColor}`;
        if (game.in_check()) status += ` ${t.check}`;
      }
      document.getElementById('status').innerText = status;
    }

    const currentTurn = game.turn();
    const config = {
      draggable: !isDrawOffer,
      position: game.fen(),
      orientation: currentTurn === 'w' ? 'white' : 'black',
      onDragStart: onDragStart,
      onDrop: onDrop,
      onSnapEnd: onSnapEnd,
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    };

    board = Chessboard('board', config);
    board.position(game.fen(), false);

    $('#board').on('click', '*', function (e) {
      const $square = $(this).closest('.square-55d63');
      if ($square.length) {
        const square = $square.attr('data-square');
        handleSquareClick(square);
      }
    });

    function shareMove() {
      const t = translations[currentLang];
      const history = game.history({ verbose: true });
      const lastMove = history.length > 0 ? history[history.length - 1] : null;
      let moveText = '';
      let statusText = t.yourTurnText;
      
      if (lastMove) {
        moveText = ` (${lastMove.from}-${lastMove.to})`;
      }

      if (game.in_checkmate()) {
        statusText = t.checkmateText;
      } else if (game.in_check()) {
        statusText = t.checkText;
      }

      const encodedFen = encodeURIComponent(game.fen());
      const gameUrl = `https://allegro1582.github.io/telegram-chess/?fen=${encodedFen}`;
      const text = encodeURIComponent(`${t.myMoveText}${moveText}${statusText}`);
      sendTelegramLink(gameUrl, text);
    }

    function offerDraw() {
      const t = translations[currentLang];
      const encodedFen = encodeURIComponent(game.fen());
      const gameUrl = `https://allegro1582.github.io/telegram-chess/?fen=${encodedFen}&drawOffer=true`;
      const text = encodeURIComponent(t.drawOfferText);
      sendTelegramLink(gameUrl, text);
    }

    function acceptDraw() {
      const t = translations[currentLang];
      document.getElementById('status').innerText = t.drawAccepted;
      document.getElementById('drawOfferActions').style.display = 'none';
      document.getElementById('mainOptions').style.display = 'flex';
    }

    function declineDraw() {
      const encodedFen = encodeURIComponent(game.fen());
      window.location.href = `https://allegro1582.github.io/telegram-chess/?fen=${encodedFen}`;
    }

    function sendTelegramLink(gameUrl, text) {
      const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(gameUrl)}&text=${text}`;
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(shareUrl);
      } else {
        window.open(shareUrl, '_blank');
      }
    }

    function resetGame() {
      window.location.href = 'https://allegro1582.github.io/telegram-chess/';
    }

    setLanguage(currentLang);
  </script>
</body>
</html>
