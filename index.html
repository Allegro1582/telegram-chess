    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1e1e24;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    
    .lang-selector {
      display: flex;
      gap: 4px;
      margin-bottom: 14px;
      background: #141418;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid #2d2d38;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: #8e8e99;
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
      letter-spacing: 0.5px;
    }
    .lang-btn:hover {
      color: #ffffff;
    }
    .lang-btn.active {
      background: #2ea6ff;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(46, 166, 255, 0.4);
    }

    #status {
      font-size: 1.1rem;
      margin-bottom: 8px;
      font-weight: 600;
      text-align: center;
      min-height: 2.2em;
    }

    /* Блок панели последнего хода */
    .last-move-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 0.9rem;
      color: #a0a0ab;
      background: #262630;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #33333e;
    }

    .last-move-btn {
      background: #141418;
      border: 1px solid #404050;
      color: #ff9800;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .last-move-btn:hover {
      border-color: #ff9800;
      background: #202028;
    }
    .last-move-btn.active-highlight {
      background: #ff9800;
      color: #1e1e24;
      border-color: #ff9800;
      box-shadow: 0 0 10px rgba(255, 152, 0, 0.4);
    }
    
    .board-container {
      position: relative;
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
    }

    #board {
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      border-radius: 8px;
      overflow: visible !important;
      position: relative;
    }

    .board-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 15, 20, 0.85);
      backdrop-filter: blur(3px);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 500;
      animation: fadeIn 0.4s ease forwards;
    }
    .board-overlay h2 {
      margin: 0;
      font-size: 2.2rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .board-overlay.defeat h2 {
      color: #ff4d4d;
      text-shadow: 0 4px 12px rgba(255, 77, 77, 0.4);
    }
    .board-overlay.victory h2 {
      color: #4caf50;
      text-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
    }
    .board-overlay p {
      margin: 8px 0 0 0;
      font-size: 1rem;
      color: #d0d0d5;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Делаем буквы и цифры белыми и выносим за доску */
    .notation-32298 { color: #ffffff !important; font-weight: bold; font-size: 11px; }
    .alpha-d2270 { bottom: -18px !important; right: 4px !important; }
    .numeric-fc462 { left: -16px !important; top: 4px !important; }

    /* Стили подсветки последнего хода на доске */
    .highlight-last-from { background-color: rgba(255, 152, 0, 0.35) !important; }
    .highlight-last-to { background-color: rgba(255, 152, 0, 0.6) !important; }

    .highlight-hint { box-shadow: inset 0 0 0 3px #4caf50 !important; cursor: pointer !important; }
    .highlight-capture {
      box-shadow: inset 0 0 0 3px #f44336 !important;
      cursor: pointer !important;
      position: relative;
    }
    .highlight-capture::after {
      content: "⚔️";

      transform: translate(-50%, -50%);
      font-size: 28px;
      pointer-events: none;
      z-index: 100;
      opacity: 0.9;

    .rules-content {

    let currentLang = localStorage.getItem('app_lang') || (tg?.initDataUnsafe?.user?.language_code?.substring(0,2)) || 'ru';
    if (!translations[currentLang]) currentLang = 'ru';

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('app_lang', lang);
      
      $('.lang-btn').removeClass('active');
      $(`.lang-btn[data-lang="${lang}"]`).addClass('active');

      const t = translations[currentLang];
      $('#sendBtn').text(t.send);
      $('#undoBtn').text(t.undo);
      $('#acceptBtn').text(t.accept);
      $('#declineBtn').text(t.decline);
      $('#drawBtn').text(t.draw);
      $('#resetBtn').text(t.reset);
      $('#botBtn').text(t.bot);
      $('#lastMoveLabel').text(t.lastMoveLabel);
      $('#rulesHeader').text(t.rulesTitle);
      $('#rulesContent').html(t.rulesHtml);

      updateLastMovePanel();
      updateStatus();
    }

    let board = null;
    let game = new Chess();
    let initialFen = null;
    let selectedSquare = null;
    let vsBot = false;
    let stockfish = null;
    let isLastMoveHighlighted = false;

    try {
      stockfish = typeof Stockfish === 'function' ? Stockfish() : new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
      stockfish.onmessage = function(event) {
        const msg = event.data || event;
        if (typeof msg === 'string' && msg.startsWith('bestmove')) {
          const moveString = msg.split(' ')[1];
          if (moveString) {
            const from = moveString.substring(0, 2);
            const to = moveString.substring(2, 4);
            const promotion = moveString.substring(4, 5) || 'q';
            
            game.move({ from: from, to: to, promotion: promotion });
            board.position(game.fen());
            
            isLastMoveHighlighted = false;
            updateLastMovePanel();
            updateStatus();
          }
        }
      };
    } catch(e) {
      console.log('Stockfish init error:', e);
    }

    const urlParams = new URLSearchParams(window.location.search);
    const rawFen = urlParams.get('fen');
    const isDrawOffer = urlParams.get('drawOffer') === 'true';
    const modeBot = urlParams.get('bot') === 'true';

    if (rawFen) {
      game.load(decodeURIComponent(rawFen));
    }
    if (modeBot) {
      vsBot = true;
    }
    initialFen = game.fen();

    // Функция обновления панели последнего хода
    function updateLastMovePanel() {
      const t = translations[currentLang];
      const history = game.history({ verbose: true });
      const $btn = $('#lastMoveBtn');

      if (history.length > 0) {
        const last = history[history.length - 1];
        $btn.text(`${last.from}-${last.to}`);
        $btn.prop('disabled', false);

        $('#board .square-55d63').removeClass('highlight-last-from highlight-last-to');
        if (isLastMoveHighlighted) {
          $('#board .square-' + last.from).addClass('highlight-last-from');
          $('#board .square-' + last.to).addClass('highlight-last-to');
          $btn.addClass('active-highlight');
        } else {
          $btn.removeClass('active-highlight');
        }
      } else {
        $btn.text(t.noMoves);
        $btn.prop('disabled', true);
        $btn.removeClass('active-highlight');
      }
    }

    // Переключение подсветки по клику на кнопку
    function toggleLastMoveHighlight() {
      const history = game.history({ verbose: true });
      if (history.length === 0) return;
      isLastMoveHighlighted = !isLastMoveHighlighted;
      updateLastMovePanel();
    }

    function removeHighlights () {
      $('#board .square-55d63').removeClass('highlight-selected highlight-hint highlight-capture');
      updateLastMovePanel();
    }

    function showLegalMoves (square) {
      removeHighlights();
      const moves = game.moves({ square: square, verbose: true });
      if (moves.length === 0) return;

      $('#board .square-' + square).addClass('highlight-selected');
      for (let i = 0; i < moves.length; i++) {
        const move = moves[i];
        if (move.flags.includes('c') || move.flags.includes('e')) {
          $('#board .square-' + move.to).addClass('highlight-capture');
        } else {
          $('#board .square-' + move.to).addClass('highlight-hint');
        }
      }
    }

    function makeMove (source, target) {
      if (vsBot && game.turn() === 'b') return false;

      if (!vsBot && game.fen() !== initialFen) {
        game.undo();
      }

      const move = game.move({
        from: source,
        to: target,
        promotion: 'q'
      });

      if (move === null) return false;

      removeHighlights();
      board.position(game.fen());
      
      isLastMoveHighlighted = false;
      updateLastMovePanel();
      updateStatus();

      if (!vsBot) {
        document.getElementById('moveActions').style.display = 'flex';
      } else if (!game.game_over() && game.turn() === 'b') {
        triggerBotMove();
      }

      selectedSquare = null;
      return true;
    }

    function triggerBotMove() {
      const t = translations[currentLang];
      document.getElementById('status').innerText = t.botThinking;
      setTimeout(() => {
        if (stockfish) {
          stockfish.postMessage('position fen ' + game.fen());
          stockfish.postMessage('go depth 6');
        } else {
          const moves = game.moves({ verbose: true });
          if (moves.length > 0) {
            const randomMove = moves[Math.floor(Math.random() * moves.length)];
            game.move(randomMove);
            board.position(game.fen());
            isLastMoveHighlighted = false;
            updateLastMovePanel();
            updateStatus();
          }
        }
      }, 400);
    }

    function startBotGame() {
      window.location.href = 'https://allegro1582.github.io/telegram-chess/?bot=true';
    }

    function handleSquareClick (square) {
      if (game.game_over() || isDrawOffer || (vsBot && game.turn() === 'b')) return;

      const piece = game.get(square);
      const isCurrentTurnPiece = piece && (
        (game.turn() === 'w' && piece.color === 'w') ||
        (game.turn() === 'b' && piece.color === 'b')
      );

      if (isCurrentTurnPiece) {
        selectedSquare = square;
        showLegalMoves(square);
        return;
      }

      if (selectedSquare) {
        const moved = makeMove(selectedSquare, square);
        if (!moved) {
          removeHighlights();
          selectedSquare = null;
        }
      }
    }

    function onDragStart (source, piece) {
      if (game.game_over() || isDrawOffer || (vsBot && game.turn() === 'b')) return false;
      if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
          (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
        return false;
      }
      selectedSquare = source;
      showLegalMoves(source);
    }

    function onDrop (source, target) {
      const moved = makeMove(source, target);
      if (!moved) return 'snapback';
    }

    function onSnapEnd () {
      removeHighlights();
    }

    function undoMove() {
      if (vsBot) return;
      game.load(initialFen);
      board.position(initialFen);
      removeHighlights();
      selectedSquare = null;
      document.getElementById('moveActions').style.display = 'none';
      document.getElementById('boardOverlay').style.display = 'none';
      isLastMoveHighlighted = false;
      updateLastMovePanel();
      updateStatus();
    }

    function updateStatus () {
      const t = translations[currentLang];
      let status = '';
      let moveColor = game.turn() === 'b' ? t.black : t.white;

      if (isDrawOffer) {
        status = t.drawOffer;
        document.getElementById('drawOfferActions').style.display = 'flex';
        document.getElementById('mainOptions').style.display = 'none';
        document.getElementById('boardOverlay').style.display = 'none';
      } else if (game.in_checkmate()) {
        status = `${t.checkmate}${game.turn() === 'w' ? t.black : t.white}.`;
        
        const winnerColor = game.turn() === 'w' ? 'b' : 'w';
        const boardOrientation = board.orientation();
        
        const overlay = document.getElementById('boardOverlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlaySub = document.getElementById('overlaySub');

        if (winnerColor === boardOrientation[0]) {
          overlay.className = 'board-overlay victory';
          overlayTitle.innerText = t.victoryTitle;
          overlaySub.innerText = t.checkmateSub;
        } else {
          overlay.className = 'board-overlay defeat';
          overlayTitle.innerText = t.defeatTitle;
          overlaySub.innerText = t.checkmateSub;
        }
        overlay.style.display = 'flex';

      } else if (game.in_draw()) {
        status = t.drawGame;
        document.getElementById('boardOverlay').style.display = 'none';
      } else {
        document.getElementById('boardOverlay').style.display = 'none';
        const isMoved = game.fen() !== initialFen;
        status = (!vsBot && isMoved) ? t.moved : `${t.turn}: ${moveColor}`;
        if (game.in_check()) status += ` ${t.check}`;
      }
      document.getElementById('status').innerText = status;
    }

    const currentTurn = game.turn();
    const config = {
      draggable: !isDrawOffer,
      position: game.fen(),
      orientation: currentTurn === 'w' ? 'white' : 'black',
      onDragStart: onDragStart,
      onDrop: onDrop,
      onSnapEnd: onSnapEnd,
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    };

    board = Chessboard('board', config);
    board.position(game.fen(), false);

    // Инициализируем панель при запуске
    updateLastMovePanel();

    $('#board').on('click', '*', function (e) {
      const $square = $(this).closest('.square-55d63');
      if ($square.length) {
        const square = $square.attr('data-square');
        handleSquareClick(square);
      }
    });

    function shareMove() {
      const t = translations[currentLang];
      const history = game.history({ verbose: true });
      const lastMove = history.length > 0 ? history[history.length - 1] : null;
      let moveText = '';
      let statusText = t.yourTurnText;
      
      if (lastMove) {
        moveText = ` (${lastMove.from}-${lastMove.to})`;
      }

      if (game.in_checkmate()) {
        statusText = t.checkmateText;
      } else if (game.in_check()) {
        statusText = t.checkText;
      }

      const encodedFen = encodeURIComponent(game.fen());
      const gameUrl = `https://allegro1582.github.io/telegram-chess/?fen=${encodedFen}`;
      const text = encodeURIComponent(`${t.myMoveText}${moveText}${statusText}`);
      sendTelegramLink(gameUrl, text);
    }

    function offerDraw() {
      if (vsBot) return;
      const t = translations[currentLang];
      const encodedFen = encodeURIComponent(game.fen());
      const gameUrl = `https://allegro1582.github.io/telegram-chess/?fen=${encodedFen}&drawOffer=true`;
      const text = encodeURIComponent(t.drawOfferText);
      sendTelegramLink(gameUrl, text);
    }

    function acceptDraw() {
      const t = translations[currentLang];
      document.getElementById('status').innerText = t.drawAccepted;
      document.getElementById('drawOfferActions').style.display = 'none';
      document.getElementById('mainOptions').style.display = 'flex';
    }

    function declineDraw() {
      const encodedFen = encodeURIComponent(game.fen());
      window.location.href = `https://allegro1582.github.io/telegram-chess/?fen=${encodedFen}`;
    }

    function sendTelegramLink(gameUrl, text) {
      const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(gameUrl)}&text=${text}`;
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(shareUrl);
      } else {
        window.open(shareUrl, '_blank');
      }
    }

    function resetGame() {
      window.location.href = 'https://allegro1582.github.io/telegram-chess/';
    }

    setLanguage(currentLang);
  </script>
</body>
</html>
