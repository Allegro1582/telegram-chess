<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allegro Chess</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1e1e24;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    #status {
      font-size: 1.1rem;
      margin-bottom: 15px;
      font-weight: 600;
      text-align: center;
      min-height: 2.4em;
    }
    #board {
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      border-radius: 8px;
      overflow: hidden;
    }
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 360px;
    }
    button {
      flex: 1;
      padding: 14px 8px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-send {
      background-color: #2ea6ff;
      color: #ffffff;
    }
    .btn-reset {
      background-color: #e53935;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div id="status">Загрузка игры...</div>
  <div id="board"></div>

  <div class="controls">
    <button class="btn-send" id="sendBtn" onclick="shareMove()" style="display:none;">📤 Отправить ход</button>
    <button class="btn-reset" onclick="resetGame()">🔄 Сбросить доску</button>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    let board = null;
    let game = new Chess();
    let moveMade = false;

    const urlParams = new URLSearchParams(window.location.search);
    const startFen = urlParams.get('fen');

    if (startFen) {
      game.load(decodeURIComponent(startFen));
    }

    function onDragStart (source, piece) {
      if (game.game_over() || moveMade) return false;
      if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
          (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
        return false;
      }
    }

    function onDrop (source, target) {
      const move = game.move({
        from: source,
        to: target,
        promotion: 'q'
      });

      if (move === null) return 'snapback';

      moveMade = true;
      updateStatus();
      document.getElementById('sendBtn').style.display = 'block';
    }

    function onSnapEnd () {
      board.position(game.fen());
    }

    function updateStatus () {
      let status = '';
      let moveColor = game.turn() === 'b' ? 'Чёрные' : 'Белые';

      if (game.in_checkmate()) {
        status = `Мат! Победили ${game.turn() === 'w' ? 'Чёрные' : 'Белые'}.`;
      } else if (game.in_draw()) {
        status = 'Ничья!';
      } else {
        status = `Ход: ${moveColor}`;
        if (game.in_check()) status += ' (Шах!)';
        if (moveMade) status = 'Ход сделан! Отправьте ссылку другу и ждите его ответного хода в чате.';
      }
      document.getElementById('status').innerText = status;
    }

    const currentTurn = game.turn();
    const config = {
      draggable: true,
      position: game.fen(),
      orientation: currentTurn === 'w' ? 'white' : 'black',
      onDragStart: onDragStart,
      onDrop: onDrop,
      onSnapEnd: onSnapEnd,
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    };

    board = Chessboard('board', config);
    updateStatus();

    function shareMove() {
      const currentFen = encodeURIComponent(game.fen());
      const baseUrl = window.location.origin + window.location.pathname;
      const gameUrl = `${baseUrl}?fen=${currentFen}`;
      const text = encodeURIComponent(`Мой ход в Allegro Chess! Твой черёд:`);
      const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(gameUrl)}&text=${text}`;

      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(shareUrl);
      } else {
        window.open(shareUrl, '_blank');
      }
    }

    function resetGame() {
      // Прямой сброс без системных alert/confirm, которые блокирует Telegram
      window.location.href = window.location.origin + window.location.pathname;
    }
  </script>
</body>
</html>
